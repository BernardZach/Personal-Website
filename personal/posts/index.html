<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Post Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="tiled-bg">
    <header class="title-banner">
      <h1 class="fantasy-title pixelated">Archypelago's Corner</h1>
    </header>

    <main class="site-shell">
      <section class="panel blog-post-panel">
        <h2 class="panel-title">Post Archive</h2>
        <p class="mini-note">Generated from markdown post manifest.</p>
        <div class="post-list" id="recentPostsList" data-show-all="true">
          <article class="post-item">
            <h3>Loading archive...</h3>
          </article>
        </div>
        <p><a href="../index.html">← Back to Home</a></p>
      </section>
    </main>

    <script src="../scripts.js" type="module"></script>
  </body>
</html>
